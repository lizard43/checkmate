name: Byte-exact Intel 8080 ROM RE
on:
  push:
    branches: [codex/8080-native-framework-re]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-re:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enable original zmac v1.3 binary
        run: chmod +x tools/zmac
      - name: Reconstruct native 8080, original ROM and machine map
        run: bash build.sh
      - name: Verify original indexed-VM ancestry independently
        run: python3 tools/framework_lineage.py
      - name: Publish original RE, disassembly and rebuilt ROMs on PR branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/8080-native-framework-re'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/*.asm docs/recovery.json docs/memory-map.svg docs/memory-map.md docs/framework-lineage.md docs/framework-lineage.json roms/build/
          git add -f src/zout/*.lst roms/original/checkmat.zip
          if ! git diff --cached --quiet; then
            git commit -m "re: original native 8080 disassembly and byte-verified ROM artifacts [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: byte-exact-8080-roms
          if-no-files-found: error
          path: |
            roms/build/
            src/*.asm
            src/zout/
            docs/recovery.json
            docs/memory-map.svg
            docs/framework-lineage.json
